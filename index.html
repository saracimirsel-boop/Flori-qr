<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria e Florit</title>
    <style>
        body { margin: 0; padding: 20px; background: #000; color: white; font-family: sans-serif; text-align: center; }
        .container { max-width: 600px; margin: auto; display: flex; flex-direction: column; gap: 20px; }
        h1 { font-size: 26px; margin-bottom: 5px; color: #fff; text-shadow: 0 2px 4px rgba(255,255,255,0.2); }
        .dedication { font-style: italic; color: #ddd; font-size: 15px; margin-bottom: 15px; }
        
        /* Stili dhe efektet e fotove */
        img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            display: none;
            opacity: 0;
            transform: translateY(20px);
        }
        img:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.3);
        }
        img.loaded {
            display: block;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        audio { width: 100%; border-radius: 12px; }
        .audio-box { margin-bottom: 10px; }

        /* Stili për lojën interaktive me prekje */
        .game-box {
            background: #111;
            border: 2px solid #333;
            border-radius: 20px;
            padding: 20px;
            margin-top: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .game-target {
            font-size: 40px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
            display: inline-block;
            margin: 15px;
            padding: 10px;
            background: #222;
            border-radius: 15px;
        }
        .game-target:active {
            transform: scale(0.8);
        }
        .game-btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,255,136,0.3);
        }
        .stats {
            font-size: 18px;
            margin-top: 10px;
            color: #00ff88;
        }
    </style>
</head>
<body>
    <h1>Galeria e Florit</h1>
    <div class="dedication">Kujtimet më të bukura, të përjetësuara me dashuri...</div>
    
    <div class="container">
        <!-- Kutia e Muzikes -->
        <div class="audio-box">
            <audio controls autoplay src="flori.mp3"></audio>
        </div>

        <!-- Fotot me efekte pamore -->
        <img src="foto.jpg" onload="this.classList.add('loaded')">
        <img src="foto1.jpg" onload="this.classList.add('loaded')">
        <img src="foto2.jpg" onload="this.classList.add('loaded')">
        <img src="foto3.jpg" onload="this.classList.add('loaded')">

        <!-- Seksioni i Lojës Interaktive -->
        <div class="game-box">
            <h3>🎯 Kap Simbolin!</h3>
            <p style="font-size: 14px; color: #aaa;">Prek simbolin që ndizet sa më shpejt për të fituar pikë!</p>
            <div id="targetArea">
                <span class="game-target" onclick="prekSimbolin()">⭐</span>
            </div>
            <button class="game-btn" onclick="nisLojen()">Fillo Lojën</button>
            <div class="stats">Pikët: <span id="gameScore">0</span> | Koha: <span id="timeLeft">15</span>s</div>
        </div>
    </div>

    <script>
        let score = 0;
        let timeLeft = 15;
        let gameInterval;
        let isPlaying = false;
        const symbols = ['⭐', '❤️', '🔥', '💎', '🚀', '👑'];

        function nisLojen() {
            if (isPlaying) return;
            isPlaying = true;
            score = 0;
            timeLeft = 15;
            document.getElementById("gameScore").innerText = score;
            document.getElementById("timeLeft").innerText = timeLeft;
            
            ndryshoPozicionin();

            gameInterval = setInterval(function() {
                timeLeft--;
                document.getElementById("timeLeft").innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(gameInterval);
                    isPlaying = false;
                    alert("Koha mbaroi! Pikët e tua totale janë: " + score);
                }
            }, 1000);
        }

        function prekSimbolin() {
            if (!isPlaying) return;
            score++;
            document.getElementById("gameScore").innerText = score;
            ndryshoPozicionin();
        }

        function ndryshoPozicionin() {
            const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
            const targetArea = document.getElementById("targetArea");
            targetArea.innerHTML = `<span class="game-target" onclick="prekSimbolin()">${randomSymbol}</span>`;
        }
    </script>
</body>
</html>

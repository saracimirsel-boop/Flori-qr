<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria e Florit</title>
    <style>
        body { margin: 0; padding: 20px; background: #000; color: white; font-family: sans-serif; text-align: center; }
        .container { max-width: 600px; margin: auto; display: flex; flex-direction: column; gap: 20px; }
        h1 { font-size: 26px; margin-bottom: 5px; color: #fff; text-shadow: 0 2px 4px rgba(255,255,255,0.2); }
        .dedication { font-style: italic; color: #ddd; font-size: 15px; margin-bottom: 15px; }
        
        /* Stili dhe efektet e fotove */
        img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            display: none;
            opacity: 0;
            transform: translateY(20px);
        }
        img:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.3);
        }
        img.loaded {
            display: block;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        audio { width: 100%; border-radius: 12px; }
        .audio-box { margin-bottom: 10px; }

        /* Stili për Lojën e Golave */
        .game-box {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            border: 2px solid #00ff88;
            border-radius: 20px;
            padding: 20px;
            margin-top: 10px;
            box-shadow: 0 8px 25px rgba(0,255,136,0.2);
        }
        .goal-field {
            background: #1e7e34;
            border: 3px solid #fff;
            border-bottom: none;
            height: 140px;
            border-radius: 15px 15px 0 0;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .goalie {
            font-size: 35px;
            position: absolute;
            top: 20px;
            left: 45%;
            transition: left 0.3s ease;
        }
        .ball {
            font-size: 30px;
            position: absolute;
            bottom: 10px;
            left: 45%;
            cursor: pointer;
            transition: bottom 0.4s ease, left 0.4s ease;
        }
        .game-btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,255,136,0.4);
        }
        .stats {
            font-size: 18px;
            margin-top: 10px;
            color: #00ff88;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Galeria e Florit</h1>
    <div class="dedication">Kujtimet më të bukura, të përjetësuara me dashuri...</div>
    
    <div class="container">
        <!-- Kutia e Muzikes -->
        <div class="audio-box">
            <audio controls autoplay src="flori.mp3"></audio>
        </div>

        <!-- Fotot me efekte pamore -->
        <img src="foto.jpg" onload="this.classList.add('loaded')">
        <img src="foto1.jpg" onload="this.classList.add('loaded')">
        <img src="foto2.jpg" onload="this.classList.add('loaded')">
        <img src="foto3.jpg" onload="this.classList.add('loaded')">

        <!-- Seksioni i Lojës së Golave -->
        <div class="game-box">
            <h3>⚽ Gjuajtje në Portë (Penalty)</h3>
            <p style="font-size: 13px; color: #ddd; margin-bottom: 10px;">Zgjidh se ku dëshiron të gjuash dhe shëno gol!</p>
            
            <div class="goal-field" id="field">
                <div class="goalie" id="goalie">🥅🤖</div>
                <div class="ball" id="ball">⚽</div>
            </div>

            <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 10px;">
                <button class="game-btn" onclick="gjuaj(15)">Majtas 👈</button>
                <button class="game-btn" onclick="gjuaj(45)">Mes 🎯</button>
                <button class="game-btn" onclick="gjuaj(75)">Djathtas 👉</button>
            </div>

            <div class="stats">Gola: <span id="goals">0</span> | Gjuajtje: <span id="shots">0</span></div>
        </div>
    </div>

    <script>
        let goals = 0;
        let shots = 0;

        function gjuaj(direction) {
            shots++;
            const ball = document.getElementById("ball");
            const goalie = document.getElementById("goalie");

            // Lëviz topin drejt goditjes
            ball.style.bottom = "90px";
            ball.style.left = direction + "%";

            // Portieri lëviz lëviz kuturu
            let goaliePos = Math.random() < 0.33 ? 15 : (Math.random() < 0.66 ? 45 : 75);
            goalie.style.left = goaliePos + "%";

            setTimeout(() => {
                if (Math.abs(direction - goaliePos) > 10) {
                    goals++;
                    alert("GOOOOL! ⚽🔥 Shënove!");
                } else {
                    alert("Pritje nga portieri! 🧤 Dyqani u mbyll!");
                }

                // Përditëso pikët
                document.getElementById("goals").innerText = goals;
                document.getElementById("shots").innerText = shots;

                // Kthe topin në vend
                ball.style.bottom = "10px";
                ball.style.left = "45%";
            }, 400);
        }
    </script>
</body>
</html>

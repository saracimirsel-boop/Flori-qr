<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria e Florit</title>
    <style>
        body { margin: 0; padding: 15px; background: #000; color: white; font-family: monospace; text-align: center; }
        .container { max-width: 600px; margin: auto; display: flex; flex-direction: column; gap: 20px; }
        h1 { font-size: 24px; margin-bottom: 5px; color: #fff; font-family: sans-serif; text-shadow: 0 2px 4px rgba(255,255,255,0.2); }
        .dedication { font-style: italic; color: #ddd; font-size: 15px; margin-bottom: 10px; font-family: sans-serif; }
        
        img {
            width: 100%; border-radius: 20px;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
            display: none; opacity: 0; transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        img.loaded { display: block; opacity: 1; transform: translateY(0); }

        audio { width: 100%; border-radius: 12px; }
        .audio-box { margin-bottom: 10px; }

        /* Stili fiks si loja retro e F1 */
        .game-box {
            background: #000;
            border: 3px solid #555;
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.9);
        }
        /* Pulti i zi lart me shpejtësinë, kohën dhe hartën */
        .arcade-dashboard {
            background: #000;
            border: 2px solid #333;
            color: #fff;
            padding: 8px 5px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .speed-display { color: #ff3333; font-size: 16px; }
        .map-box {
            width: 60px; height: 25px;
            border: 1px solid #ff5555;
            border-radius: 4px;
            position: relative;
            background: #111;
        }
        .map-dot {
            width: 5px; height: 5px; background: #fff;
            border-radius: 50%; position: absolute; top: 10px; left: 20px;
        }

        .arcade-screen {
            background: #228b22; /* Fusha jeshile */
            height: 240px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 2px solid #444;
        }
        .arcade-sky {
            position: absolute; top: 0; width: 100%; height: 35%;
            background: #5090ff; /* Qielli blu */
        }
        .arcade-mountains {
            position: absolute; top: 22%; width: 100%; height: 18%;
            background: #2c5e3b;
            clip-path: polygon(0% 100%, 15% 20%, 30% 90%, 50% 10%, 70% 80%, 85% 30%, 100% 70%, 100% 100%);
        }
        .arcade-road {
            position: absolute; bottom: 0; width: 100%; height: 65%;
            background: #555; /* Rruga gri me kthesë */
            clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
        }
        .road-center-stripe {
            position: absolute; top: 0; left: 49%; width: 2%; height: 100%;
            background: #fff;
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
        }
        .arcade-car {
            position: absolute; bottom: 12px; left: 45%;
            font-size: 34px;
            z-index: 5;
            transition: left 0.1s ease-out;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.8));
        }
        .arcade-enemy {
            position: absolute; top: 45%; left: 48%;
            font-size: 24px;
            z-index: 4;
            transition: top 0.2s linear, left 0.2s linear;
        }
        .arcade-controls {
            display: flex; justify-content: center; gap: 20px; margin-top: 12px;
        }
        .arcade-btn {
            background: #ffcc00; color: #000; border: none;
            padding: 12px 35px; font-size: 15px; font-weight: bold;
            border-radius: 6px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,204,0,0.4);
        }
        .arcade-btn:active { transform: scale(0.93); background: #e6b800; }

        /* Futbolli */
        .goal-field {
            background: radial-gradient(circle, #2a9d8f 0%, #114b3e 100%);
            border: 3px solid #fff; height: 140px; border-radius: 10px;
            position: relative; overflow: hidden; margin-bottom: 8px;
        }
        .goalie { font-size: 30px; position: absolute; top: 20px; left: 45%; }
        .ball { font-size: 24px; position: absolute; bottom: 10px; left: 45%; transition: 0.3s; }
        .match-btn { background: #00ff88; border: none; padding: 8px 18px; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Galeria e Florit</h1>
    <div class="dedication">Kujtimet më të bukura, të përjetësuara me dashuri...</div>
    
    <div class="container">
        <!-- Muzika -->
        <div class="audio-box">
            <audio controls autoplay src="flori.mp3"></audio>
        </div>

        <!-- Fotot -->
        <img src="foto.jpg" onload="this.classList.add('loaded')">
        <img src="foto1.jpg" onload="this.classList.add('loaded')">
        <img src="foto2.jpg" onload="this.classList.add('loaded')">
        <img src="foto3.jpg" onload="this.classList.add('loaded')">

        <!-- Lojë F1 Klasike (Ekzakt si në imazh) -->
        <div class="game-box">
            <div class="arcade-dashboard">
                <div>LOW &nbsp; <span class="speed-display"><span id="speedVal">372</span> KM/H</span></div>
                <div>TIME<br><span id="gameTime" style="color:#ffcc00; font-size:14px;">42</span></div>
                <div>SCORE<br><span id="gameScore" style="color:#0ff; font-size:14px;">600</span></div>
                <div class="map-box"><div class="map-dot" id="mapDot"></div></div>
            </div>

            <div class="arcade-screen">
                <div class="arcade-sky"></div>
                <div class="arcade-mountains"></div>
                <div class="arcade-road"><div class="road-center-stripe"></div></div>
                <div class="arcade-enemy" id="rivalCar">🏎️</div>
                <div class="arcade-car" id="playerCar">🏎️</div>
            </div>

            <div class="arcade-controls">
                <button class="arcade-btn" onclick="driveF1(-12)">◄ MAJTAS</button>
                <button class="arcade-btn" onclick="driveF1(12)">DJATHTAS ►</button>
            </div>
        </div>

        <!-- Lojë Futbolli -->
        <div class="game-box" style="border-color: #00ff88;">
            <h3 style="color: #00ff88; margin-top:0; font-family:sans-serif; font-size:16px;">⚽ Gjuajtje në Portë</h3>
            <div class="goal-field">
                <div class="goalie" id="goalie">🤸‍♂️</div>
                <div class="ball" id="ball">⚽</div>
            </div>
            <div style="display: flex; justify-content: center; gap: 8px;">
                <button class="match-btn" onclick="gjuaj(15)">Majtas</button>
                <button class="match-btn" onclick="gjuaj(45)">Mes</button>
                <button class="match-btn" onclick="gjuaj(75)">Djathtas</button>
            </div>
            <div style="margin-top: 6px; color: #00ff88; font-weight: bold; font-family:sans-serif;">Gola: <span id="goals">0</span></div>
        </div>
    </div>

    <script>
        let carLeft = 45;
        let score = 600;
        let timeSec = 42;
        let speed = 372;

        function driveF1(val) {
            carLeft += val;
            if(carLeft < 20) carLeft = 20;
            if(carLeft > 70) carLeft = 70;
            document.getElementById("playerCar").style.left = carLeft + "%";
            
            score += 25;
            speed = Math.floor(Math.random() * 20) + 360;
            document.getElementById("gameScore").innerText = score;
            document.getElementById("speedVal").innerText = speed;
            
            // Lëviz makinën armike dhe pikën në hartë
            let rival = document.getElementById("rivalCar");
            let randPos = Math.floor(Math.random() * 40) + 30;
            rival.style.left = randPos + "%";
            rival.style.top = "55%";
            
            let mapDot = document.getElementById("mapDot");
            mapDot.style.left = (parseInt(mapDot.style.left || 20) + 3) % 45 + "px";

            setTimeout(() => { rival.style.top = "45%"; }, 180);
        }

        let goals = 0;
        function gjuaj(dir) {
            const ball = document.getElementById("ball");
            ball.style.bottom = "85px";
            ball.style.left = dir + "%";
            setTimeout(() => {
                goals++;
                document.getElementById("goals").innerText = goals;
                ball.style.bottom = "10px";
                ball.style.left = "45%";
            }, 300);
        }
    </script>
</body>
</html>

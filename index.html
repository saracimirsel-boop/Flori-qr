<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria e Florit</title>
    <style>
        body { margin: 0; padding: 15px; background: #000; color: white; font-family: monospace; text-align: center; }
        .container { max-width: 600px; margin: auto; display: flex; flex-direction: column; gap: 20px; }
        h1 { font-size: 24px; margin-bottom: 5px; color: #fff; text-shadow: 0 2px 4px rgba(255,255,255,0.2); font-family: sans-serif; }
        .dedication { font-style: italic; color: #ddd; font-size: 15px; margin-bottom: 10px; font-family: sans-serif; }
        
        /* Stili i fotove */
        img {
            width: 100%; border-radius: 20px;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
            display: none; opacity: 0; transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        img.loaded { display: block; opacity: 1; transform: translateY(0); }

        audio { width: 100%; border-radius: 12px; }
        .audio-box { margin-bottom: 10px; }

        /* Stili Retro F1 (Pole Position Style) */
        .game-box {
            background: #111;
            border: 3px solid #333;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }
        /* Paneli lart si në lojën klasike */
        .retro-dashboard {
            background: #000;
            border: 2px solid #555;
            color: #0ff;
            padding: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .retro-screen {
            background: #228b22; /* Fusha e gjelbër */
            height: 240px;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 3px solid #444;
        }
        .retro-sky {
            position: absolute;
            top: 0; width: 100%; height: 40%;
            background: #5090ff; /* Qielli blu */
        }
        .retro-mountains {
            position: absolute;
            top: 30%; width: 100%; height: 10%;
            background: #3b7a57; /* Kodrat në sfond */
            clip-path: polygon(0% 100%, 10% 40%, 25% 90%, 40% 20%, 60% 80%, 75% 30%, 90% 90%, 100% 50%, 100% 100%);
        }
        .retro-road {
            position: absolute;
            bottom: 0; width: 100%; height: 60%;
            background: #555; /* Rruga gri */
            clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%);
        }
        .road-stripe {
            position: absolute;
            top: 0; left: 49%; width: 2%; height: 100%;
            background: #fff;
            clip-path: polygon(40% 0%, 60% 0%, 100% 100%, 0% 100%);
        }
        .retro-car {
            position: absolute;
            bottom: 15px; left: 45%;
            font-size: 35px;
            transition: left 0.15s ease;
            z-index: 5;
        }
        .retro-enemy {
            position: absolute;
            top: 50%; left: 48%;
            font-size: 25px;
            transition: top 0.2s linear, left 0.2s linear;
            z-index: 4;
        }
        .game-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .retro-btn {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,204,0,0.4);
        }
        .retro-btn:active { transform: scale(0.95); }

        /* Futbolli */
        .goal-field {
            background: radial-gradient(circle, #2a9d8f 0%, #114b3e 100%);
            border: 4px solid #fff; height: 160px; border-radius: 10px;
            position: relative; overflow: hidden; margin-bottom: 10px;
        }
        .goalie { font-size: 35px; position: absolute; top: 30px; left: 45%; }
        .ball { font-size: 28px; position: absolute; bottom: 10px; left: 45%; transition: 0.3s; }
        .match-btn { background: #00ff88; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Galeria e Florit</h1>
    <div class="dedication">Kujtimet më të bukura, të përjetësuara me dashuri...</div>
    
    <div class="container">
        <!-- Muzika -->
        <div class="audio-box">
            <audio controls autoplay src="flori.mp3"></audio>
        </div>

        <!-- Fotot -->
        <img src="foto.jpg" onload="this.classList.add('loaded')">
        <img src="foto1.jpg" onload="this.classList.add('loaded')">
        <img src="foto2.jpg" onload="this.classList.add('loaded')">
        <img src="foto3.jpg" onload="this.classList.add('loaded')">

        <!-- Lojë 1: F1 Retro Style -->
        <div class="game-box">
            <h3 style="color: #ffcc00; margin-top:0;">🏎️ F1 Retro Race</h3>
            
            <!-- Paneli lart fiks si në foto -->
            <div class="retro-dashboard">
                <div>312 KM/H</div>
                <div>TIME <span id="gameTime">42</span></div>
                <div>SCORE <span id="gameScore">600</span></div>
            </div>

            <div class="retro-screen">
                <div class="retro-sky"></div>
                <div class="retro-mountains"></div>
                <div class="retro-road"><div class="road-stripe"></div></div>
                <div class="retro-enemy" id="enemyF1">🏎️</div>
                <div class="retro-car" id="myF1">🏎️</div>
            </div>

            <div class="game-controls">
                <button class="retro-btn" onclick="steerF1(-15)">◀ MAJTAS</button>
                <button class="retro-btn" onclick="steerF1(15)">DJATHTAS ▶</button>
            </div>
        </div>

        <!-- Lojë 2: Gjuajtje në Portë -->
        <div class="game-box" style="border-color: #00ff88;">
            <h3 style="color: #00ff88; margin-top:0;">⚽ Gjuajtje në Portë</h3>
            <div class="goal-field">
                <div class="goalie" id="goalie">🤸‍♂️</div>
                <div class="ball" id="ball">⚽</div>
            </div>
            <div style="display: flex; justify-content: center; gap: 8px;">
                <button class="match-btn" onclick="gjuaj(15)">Majtas</button>
                <button class="match-btn" onclick="gjuaj(45)">Mes</button>
                <button class="match-btn" onclick="gjuaj(75)">Djathtas</button>
            </div>
            <div style="margin-top: 8px; color: #00ff88; font-weight: bold;">Gola: <span id="goals">0</span></div>
        </div>
    </div>

    <script>
        // Logjika e F1 Retro
        let f1Pos = 45;
        let score = 600;
        function steerF1(val) {
            f1Pos += val;
            if(f1Pos < 20) f1Pos = 20;
            if(f1Pos > 70) f1Pos = 70;
            document.getElementById("myF1").style.left = f1Pos + "%";
            
            score += 50;
            document.getElementById("gameScore").innerText = score;
            
            // Lëviz makinën armike në drejtim të rastësishëm
            let enemy = document.getElementById("enemyF1");
            let randomLeft = Math.floor(Math.random() * 50) + 25;
            enemy.style.left = randomLeft + "%";
            enemy.style.top = "60%";
            setTimeout(() => { enemy.style.top = "45%"; }, 200);
        }

        // Logjika e Futbollit
        let goals = 0;
        function gjuaj(dir) {
            const ball = document.getElementById("ball");
            const goalie = document.getElementById("goalie");
            ball.style.bottom = "100px";
            ball.style.left = dir + "%";
            
            setTimeout(() => {
                goals++;
                document.getElementById("goals").innerText = goals;
                ball.style.bottom = "10px";
                ball.style.left = "45%";
            }, 400);
        }
    </script>
</body>
</html>
